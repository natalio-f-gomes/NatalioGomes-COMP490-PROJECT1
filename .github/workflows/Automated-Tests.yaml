name: Project 1 CI CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  Sprint-1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: sprint_1
        run: |
          python --version
          python -m pip install --upgrade pip
          echo "::group::Install Dependecies"
          pip install pylint pytest
          pip install -r requirements.txt
          pip install pylint-venv
          echo "::endgroup::"
          pwd

      - name: Install system requirements
        working-directory: sprint_1
        run: |
          sudo apt-get update
          sudo apt-get install portaudio19-dev

      - name: Lint with pylint
        env:
          PYTHONPATH: sprint_1
        run: |
          pylint sprint_1 \
            --init-hook="import pylint_venv; pylint_venv.inithook()" \
            --max-line-length=120 \
            --disable=W0613

      - name: Clone Vosk-API
        env:
          PYTHONPATH: sprint_1
        run: git clone https://github.com/alphacep/vosk-api

      - name: Run Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/Sprint-1
        run: |
          cd sprint_1
          ls -la
          python -m pytest -v --tb=long

  Sprint-4-Deploy-Server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: sprint_4/RoomBookingServer
        run: |
          sudo apt-get update
          python --version
          echo "::group:: Install dependencies"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "::endgroup::"
          pwd

      - name: Debug env vars
        run: |
          echo "SSH KEY is set: ${{ secrets.DIGITAL_OCEAN_SSH_KEY != '' }}"
          echo "IPADDRESS: ${{ secrets.DROPLET_IP_ADDRESS != '' }}"

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DIGITAL_OCEAN_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DROPLET_IP_ADDRESS }} >> ~/.ssh/known_hosts

      - name: Connect to Digital Ocean Droplet
        env:
            PYTHONPATH: ${{ github.workspace }}/sprint_4/Room_booking_serve
            DITIAL_OCEAN_SSH_KEY: ${{ secrets.DIGITAL_OCEAN_SSH_KEY }}
            DROPLET_IP: ${{ secrets.DROPLET_IP_ADDRESS }}
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@$DROPLET_IP << 'EOF'
          echo "Running Server: $(pwd)"
          echo "User: $(whoami)"
          echo "Server IP address: $(hostname -I)"
          EOF

      - name: Copy RoomBookingServer to Droplet
        run: |
          rsync -avz --exclude='.git' \
                     --exclude='venv' \
                     --exclude='__pycache__' \
                     --exclude='.env' \
                     -e "ssh -i ~/.ssh/id_ed25519" \
                     ${{ github.workspace }}/sprint_4/RoomBookingServer deploy@${{ secrets.DROPLET_IP_ADDRESS }}:/home/deploy/

      - name: Deploy to DIGITAL OCEAN
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.DROPLET_IP_ADDRESS }} << 'EOF'
            echo "Contents:"
            ls -la

            echo "Installing Python..."
            sudo apt update -y
            sudo apt install python3 python3-pip python3-venv -y

            echo "Python version:"
            python3 --version

            echo "Project folder..."
            cd RoomBookingServer

            echo "Creating virtual environment..."
            python3 -m venv .venv

            echo "Activating virtual environment..."
            source .venv/bin/activate

            echo "Installing requirements..."
            pip install -r requirements.txt

            echo "Running migrations..."
            python3 manage.py migrate
            
            echo "enabling port 8000..."
            sudo ufw allow 8000
            
            echo "Start and enable Gunicorn"
            sudo systemctl daemon-reload
            sudo systemctl start gunicorn
            sudo systemctl enable gunicorn  
            sudo systemctl status gunicorn   
          
            echo "Done!"
          EOF

  Sprint-2:
    needs: Sprint-4-Deploy-Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: sprint_2
        run: |
          sudo apt-get update
          python --version
          echo "::group::Install Dependencies"
          python -m pip install --upgrade pip
          pip install pylint pytest
          pip install -r requirements.txt
          pip install pylint-venv
          echo "::endgroup::"
          pwd

      - name: Lint with pylint
        env:
          PYTHONPATH: sprint_2
        run: |
          pylint sprint_2 \
            --init-hook="import pylint_venv; pylint_venv.inithook()" \
            --max-line-length=120
      - name: Debug env vars
        run: |
          echo "SERVER_ADDRESS is set: ${{ secrets.SERVER_ADDRESS != '' }}"
          echo "SERVER_PORT is set: ${{ secrets.SERVER_PORT != '' }}"

      - name: Run Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/sprint_2
          SERVER_ADDRESS: ${{ secrets.SERVER_ADDRESS }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          pwd
          cd sprint_2
          ls -la
          python -m pytest tests/ -v --tb=long
          

  Sprint-3:
    needs: Sprint-2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone Vosk-API
        env:
          PYTHONPATH: sprint_3
        run: git clone https://github.com/alphacep/vosk-api

      - name: Install system requirements
        working-directory: sprint_1
        run: |
          sudo apt-get update
          sudo apt-get install portaudio19-dev

      - name: Install dependencies
        working-directory: sprint_3
        run: |
          sudo apt-get update
          python --version
          echo "::group:: Install dependencies"
          python -m pip install --upgrade pip
          pip install pylint pytest
          pip install -r requirements.txt
          echo "::endgroup::"
          pip install pylint-venv
          pwd

      - name: Lint with pylint
        env:
          PYTHONPATH: sprint_3
        run: |
          pylint sprint_3 \
            --init-hook="import pylint_venv; pylint_venv.inithook()" \
            --max-line-length=120 \
            --disable=W0613

      - name: Debug env vars
        run: |
          echo "SERVER_ADDRESS is set: ${{ secrets.SERVER_ADDRESS != '' }}"
          echo "SERVER_PORT is set: ${{ secrets.SERVER_PORT != '' }}"
          echo "EMAIL is set: ${{ secrets.EMAIL != '' }}"
          echo "PASSWORD is set: ${{ secrets.PASSWORD != '' }}"
          echo "CLAUDE API KEY is set: ${{ secrets.ANTHROPIC_API_KEY != '' }}"

      - name: Run Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/sprint_3
          SERVER_ADDRESS: ${{ secrets.SERVER_ADDRESS }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pwd
          cd sprint_3
          ls -la
          python -m pytest tests/*

  Sprint-4-GUI:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: sprint_4/gui
        run: |
          sudo apt-get update
          python --version
          echo "::group:: Install dependencies"
          python -m pip install --upgrade pip
          pip install pylint pytest
          pip install -r requirements.txt
          echo "::endgroup::"
          pip install pylint-venv
          pwd

      - name: Lint with pylint
        env:
          PYTHONPATH: sprint_4/gui
        run: |
          pylint sprint_4/gui \
            --init-hook="import pylint_venv; pylint_venv.inithook()" \
            --max-line-length=120 \
            --disable=W0613,W0621,R0902,C0301

      - name: Run Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/sprint_4/gui
        run: |
          pwd
          cd sprint_4/gui
          ls -la
          python -m pytest tests/*
